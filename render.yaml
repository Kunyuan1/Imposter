services:
  - type: web
    name: imposter-server
    runtime: node
    plan: free
    # The server only needs "ws" at runtime; skipping devDependencies takes the
    # install from ~100 packages to 4 and keeps the free-tier build quick.
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
